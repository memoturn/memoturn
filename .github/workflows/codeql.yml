name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 3 * * 1" # weekly, Monday 03:27 UTC

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Interpreted languages need no build step; Go needs autobuild (this runner's
        # CodeQL rejects build-mode none for Go) — it builds the sdks/go module itself.
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: go
            build-mode: autobuild
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Default suite: real security vulnerabilities. The "security-and-quality" suite
      # adds noisy style/maintainability queries (e.g. "unpinned action tag") that, with
      # the branch's require-conversation-resolution rule, block every workflow-touching
      # PR. Pin actions to SHAs + re-enable the suite later if desired.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Test files are not shipped and legitimately contain adversarial fixtures — intentional
          # ReDoS regexes, fake secrets, injection strings — that trip security queries as false
          # positives (e.g. js/redos on a `(a+)+` pattern a test asserts is REJECTED). Scan product
          # code only.
          config: |
            paths-ignore:
              - '**/*.test.ts'
              - '**/*.test.tsx'
              - '**/*.spec.ts'
              - '**/*_test.go'
              - 'sdks/**/tests/**'
      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
