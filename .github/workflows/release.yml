name: Release

# Publishes the SDKs (npm + PyPI) and container images (GHCR) on a version tag.
# Auth: npm and PyPI both use Trusted Publishing (OIDC) — no secrets. Register the
# trusted publisher once on each registry (npm: @memoturn/sdk → Settings → Trusted
# Publisher; PyPI: a pending publisher) for this repo + release.yml. GHCR uses the
# built-in GITHUB_TOKEN.
#
# Run via the Actions tab with "Dry run" checked to validate the whole pipeline
# without publishing anything (npm pack, uv build, images built but not pushed).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate without publishing (no npm/PyPI upload, images not pushed)"
        type: boolean
        default: false

jobs:
  # Auto-generated GitHub release notes for the tag (skipped on dry runs, which
  # aren't tag pushes). Idempotent: no-ops if the release already exists.
  release-notes:
    name: GitHub release notes
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes

  npm:
    name: Publish @memoturn/sdk to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # Trusted Publishing needs npm >= 11.5.1; node 22 ships npm 10.x.
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - run: bun --filter @memoturn/sdk build
      # Point the published manifest at dist. The repo keeps main/types on src for
      # zero-build local dev; publishConfig holds the dist mapping, flattened here so
      # publish is deterministic regardless of npm's publishConfig handling.
      - name: Apply dist entrypoints
        working-directory: sdks/js
        run: |
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const p = JSON.parse(readFileSync("package.json", "utf8"));
            Object.assign(p, p.publishConfig); delete p.publishConfig;
            writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
          '
      - name: Publish
        working-directory: sdks/js
        # Trusted Publishing: npm authenticates via the OIDC id-token (no NODE_AUTH_TOKEN),
        # and provenance is attached automatically.
        #
        # `--tag latest` is explicit on purpose. A `@memoturn/sdk@1.0.0` from a DIFFERENT
        # project (the private memoturn-coordination repo) was published to this package on
        # 2026-08-29, so the registry's highest version now sits above this repo's 0.x line.
        # npm refuses to apply the `latest` tag IMPLICITLY when the version being published
        # is lower than the highest published one — it fails the job with "Cannot implicitly
        # apply the latest tag". Naming the tag explicitly opts out of that guard, which is
        # what we want: `latest` should track this repo's releases. That 1.0.0 is past npm's
        # 72-hour unpublish window and is deprecated in place instead.
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run — packing, not publishing."
            npm publish --dry-run --tag latest
          else
            npm publish --provenance --access public --tag latest
          fi

  pypi:
    name: Publish memoturn to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC) — no token needed
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Build wheel + sdist
        working-directory: sdks/python
        run: uv build
      - name: Publish
        if: ${{ !inputs.dry_run }}
        working-directory: sdks/python
        run: uv publish --trusted-publishing always

  go:
    name: Verify + tag Go SDK
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the sdks/go/vX.Y.Z module tag
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: sdks/go/go.mod
      - name: Vet + test
        working-directory: sdks/go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
      # Go modules in a subdirectory resolve versions from a path-prefixed tag
      # (sdks/go/vX.Y.Z), so mirror the release tag onto the module path.
      - name: Push module tag
        if: ${{ github.ref_type == 'tag' && !inputs.dry_run }}
        run: |
          git tag "sdks/go/${GITHUB_REF_NAME}" "${GITHUB_SHA}"
          git push origin "sdks/go/${GITHUB_REF_NAME}"

  # Container images are multi-arch (linux/amd64 + linux/arm64) so self-hosters on Apple
  # Silicon Macs and arm64 servers run natively instead of under emulation.
  #
  # Each architecture builds on its OWN native runner rather than cross-building both with
  # QEMU. These are Bun images, and Bun's JIT is unreliable under qemu-user emulation — a
  # cross-built arm64 layer tends to die inside `bun install`, and when it doesn't it takes
  # an order of magnitude longer. arm64 runners are free for public repositories.
  #
  # The per-arch builds push by digest and carry NO tags: two jobs racing to tag the same
  # `:latest` would leave whichever finished last as a single-arch image. The manifest job
  # below applies the tags once, to the manifest list that indexes both digests — that
  # index is what `docker pull ghcr.io/memoturn/api:0.6.0` resolves against.
  images:
    name: Build ${{ matrix.service }} image (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, console]
        platform:
          - { arch: amd64, docker: linux/amd64, runner: ubuntu-latest }
          - { arch: arm64, docker: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Only the OCI labels are used here (org.opencontainers.image.source/revision/version,
      # which GHCR reads to link the package to this repo). Tags are deliberately NOT passed
      # to a per-arch build — see the job comment.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}

      # Dry run stops here: prove the image still builds on this architecture, push nothing.
      - name: Build (no push)
        if: ${{ inputs.dry_run }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.service }}.Dockerfile
          platforms: ${{ matrix.platform.docker }}
          push: false
          labels: ${{ steps.meta.outputs.labels }}
          # Scope the cache per service AND per architecture: one shared scope has the two
          # architectures evicting each other's layers on every run.
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.platform.arch }}

      - name: Build + push by digest
        id: build
        if: ${{ !inputs.dry_run }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.service }}.Dockerfile
          platforms: ${{ matrix.platform.docker }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.service }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.platform.arch }}
      # The digest is the whole payload — an empty file named after it is enough for the
      # manifest job to reassemble `<image>@sha256:<digest>` for each architecture.
      - name: Export digest
        if: ${{ !inputs.dry_run }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - name: Upload digest
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.service }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Stitch each service's two per-arch digests into one tagged manifest list. This is the
  # job that actually publishes `:{version}`, `:{major}.{minor}` and `:latest`.
  image-manifests:
    name: Publish ${{ matrix.service }} manifest
    if: ${{ !inputs.dry_run }}
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, console]
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.service }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          # `imagetools create` annotates the INDEX. metadata-action defaults to the
          # `manifest:` level, which buildx rejects outright:
          #   ERROR: "manifest" annotations are not supported yet
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          # `latest` is applied explicitly below; the default `latest=auto` flavor would
          # add a second, identical one for a semver tag.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Create manifest list
        working-directory: /tmp/digests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          TAGS: ${{ steps.meta.outputs.tags }}
          ANNOTATIONS: ${{ steps.meta.outputs.annotations }}
        run: |
          tags=()
          while read -r tag; do
            if [ -n "$tag" ]; then tags+=(-t "$tag"); fi
          done <<< "$TAGS"
          # Each downloaded artifact is an empty file named for its digest.
          refs=()
          for digest in *; do refs+=("${IMAGE}@sha256:${digest}"); done
          # Labels live on each per-arch image; the index itself carries annotations.
          annotations=()
          while read -r annotation; do
            if [ -n "$annotation" ]; then annotations+=(--annotation "$annotation"); fi
          done <<< "$ANNOTATIONS"
          echo "Joining ${#refs[@]} per-arch digests under: ${TAGS//$'\n'/ }"
          docker buildx imagetools create "${annotations[@]}" "${tags[@]}" "${refs[@]}"

      # A single-arch regression is silent until a Mac user pulls it, so assert the
      # published tag really does index both architectures.
      - name: Verify both architectures are published
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' \
            | jq -r '.manifests[]?.platform | select(.os == "linux") | "\(.os)/\(.architecture)"' \
            | sort -u > platforms.txt
          cat platforms.txt
          for want in linux/amd64 linux/arm64; do
            grep -qx "$want" platforms.txt \
              || { echo "::error::${IMAGE}:${VERSION} does not include ${want}"; exit 1; }
          done
