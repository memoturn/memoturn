name: Docker build

# Validates that the api/worker/console images actually build (no push, no secrets).
# Runs on demand and when the Dockerfiles or dependency manifests change, so a broken
# image is caught before a release tag triggers the real publish in release.yml.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docker/**"
      - "apps/api/**"
      - "apps/worker/**"
      - "apps/console/**"
      - "packages/**"
      - "sdks/js/**"
      - "**/package.json"
      - "bun.lock"
      - ".github/workflows/docker-build.yml"

permissions:
  contents: read

jobs:
  # Both published architectures are built, each on its own native runner — matching
  # release.yml, so an arm64-only break (a base image without an arm64 variant, a
  # dependency with no prebuilt aarch64 binary) is caught on the PR rather than at tag time.
  build:
    name: Build ${{ matrix.service }} image (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, console]
        platform:
          - { arch: amd64, docker: linux/amd64, runner: ubuntu-latest }
          - { arch: arm64, docker: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/${{ matrix.service }}.Dockerfile
          platforms: ${{ matrix.platform.docker }}
          push: false
          load: false
          tags: memoturn-${{ matrix.service }}:ci
          # Same cache scopes as release.yml, so a PR build warms the release build.
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.platform.arch }}

  # Vulnerability scan of the built images (amd64 is representative — the arm64 layers carry
  # the same packages). CRITICAL/HIGH with a fix available fail the PR; unfixed findings are
  # reported, not blocking. Exceptions go in .trivyignore with a reason.
  scan:
    name: Scan ${{ matrix.service }} image (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, console]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build (load into the local daemon)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/${{ matrix.service }}.Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: memoturn-${{ matrix.service }}:scan
          cache-from: type=gha,scope=${{ matrix.service }}-amd64
      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: memoturn-${{ matrix.service }}:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
